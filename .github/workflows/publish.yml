# Publishes the SDK packages to npm. RELEASING.md is the walkthrough.
#
#   push a tag v<version>         build, test, publish every package at <version>
#   Run workflow (dry run on)     the same, ending in `npm publish --dry-run`
#   Run workflow (dry run off)    publish — only when run on a tag ("Use workflow from")
#
# Re-running is safe: a package whose version npm already has is skipped, so a
# run that failed half-way finishes the rest.
#
# A real publish from a tag then creates (or updates) the GitHub release for that
# tag, with every package's tarball and SHA256SUMS attached. Any version with a
# suffix — -pr-N, -rc-N, -alpha, -beta, -dev — is marked a pre-release and never
# becomes the repository's "latest" release; npm gets it under the `next` tag.
#
# Auth: npm trusted publishing (OIDC — no stored secret) once each package is
# configured for it on npmjs.com. Trusted publishing can only be configured on a
# package that already exists, so the very first publish uses the NPM_TOKEN
# secret instead; delete that secret once trusted publishing is set up.
name: Publish SDK packages

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            dry_run:
                description: 'Dry run: build, test and pack, but publish nothing'
                type: boolean
                default: true

permissions:
    contents: read
    id-token: write # trusted publishing and provenance both sign with the run's OIDC token

concurrency:
    group: publish-${{ github.ref }}
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        env:
            DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        steps:
            - name: Refuse a real publish from a branch
              if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && github.ref_type != 'tag'
              run: |
                  echo "::error::A real publish runs on a tag. Pick the tag under 'Use workflow from', or push it."
                  exit 1

            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'

            # Trusted publishing needs npm 11.5.1 or later; Node 24's bundled npm may be older.
            - name: Update npm
              run: npm install -g npm@^11.5.1 && npm --version

            - name: Check versions and package metadata
              env:
                  REF_TYPE: ${{ github.ref_type }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  if [ "$REF_TYPE" = "tag" ]; then
                      node scripts/release.mjs check --tag "$REF_NAME"
                  else
                      node scripts/release.mjs check
                  fi

            # No `npm ci`: the lockfile is not the source of truth for every platform.
            - name: Install
              run: |
                  for i in 1 2 3; do npm install --no-audit --no-fund && break || sleep 15; done

            # dist is not tracked in git; cleaning first means the published build starts
            # from nothing even when this runner reuses a workspace.
            - name: Build
              run: |
                  node scripts/release.mjs clean
                  npm run build

            # Tests that read the app repo (../serene-pub) skip themselves when it is absent,
            # as it is here.
            # Not required for a -pr-N pre-release (owner 2026-10-05): the suite is
            # skipped there; release candidates and releases still have to pass it.
            - name: Test
              if: ${{ !contains(github.ref_name, '-pr-') }}
              run: npm test --prefix sdk-tests

            - name: Stage LICENSE and NOTICE
              run: node scripts/release.mjs stage

            - name: Show package contents
              run: |
                  for dir in $(node scripts/release.mjs order); do
                      echo "::group::$dir"
                      npm pack --dry-run --workspace "$dir" 2>&1 | sed -n '/Tarball Contents/,/Tarball Details/p'
                      echo "::endgroup::"
                  done

            - name: Publish
              env:
                  # First publish only; empty once trusted publishing is configured, and
                  # npm prefers the OIDC exchange whenever a trusted publisher matches.
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  # npm refuses provenance from a private repository.
                  PROVENANCE: ${{ !github.event.repository.private }}
              run: |
                  if [ "$DRY_RUN" = "true" ]; then
                      node scripts/release.mjs publish --dry-run
                  else
                      node scripts/release.mjs publish
                  fi

            # The exact tarballs npm received, kept for the GitHub release. Packed after
            # publishing so a failed pack never blocks npm; packing is local (no registry).
            - name: Pack release assets
              if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
              run: |
                  mkdir -p release-assets
                  for dir in $(node scripts/release.mjs order); do
                      npm pack --workspace "$dir" --pack-destination release-assets >/dev/null
                  done
                  (cd release-assets && sha256sum *.tgz > SHA256SUMS)
                  ls -l release-assets

            - name: Keep release assets
              if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
              uses: actions/upload-artifact@v4
              with:
                  name: release-assets
                  path: release-assets/
                  if-no-files-found: error
                  retention-days: 7

    github-release:
        needs: publish
        # Only a real publish from a tag gets a release: never a dry run, never a branch.
        if: github.ref_type == 'tag' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write # create or update the release and upload its assets
        steps:
            - name: Determine release kind
              id: kind
              shell: bash
              env:
                  # Never interpolate the tag into the script body (script injection via a
                  # crafted tag name); read it from the environment.
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  VERSION="${REF_NAME#v}"
                  # A plain X.Y.Z is a release; anything else (-pr-N, -rc-N, -alpha, -beta,
                  # -dev, or a tag that is not semver at all) is a pre-release.
                  if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      PRERELEASE=false
                      DIST_TAG=latest
                  else
                      PRERELEASE=true
                      DIST_TAG=next
                  fi
                  {
                      echo "version=$VERSION"
                      echo "prerelease=$PRERELEASE"
                      echo "dist_tag=$DIST_TAG"
                  } >> "$GITHUB_OUTPUT"
                  echo "version $VERSION · pre-release $PRERELEASE · npm tag $DIST_TAG"

            - name: Fetch release assets
              uses: actions/download-artifact@v4
              with:
                  name: release-assets
                  path: release-assets

            - name: Write release body
              env:
                  VERSION: ${{ steps.kind.outputs.version }}
                  DIST_TAG: ${{ steps.kind.outputs.dist_tag }}
              run: |
                  {
                      echo "The Serene Pub SDK packages at \`$VERSION\`, published to npm under the \`$DIST_TAG\` tag."
                      echo
                      echo '```sh'
                      echo "npm install @serene-pub/sdk@$VERSION"
                      echo '```'
                      echo
                      echo '| Package | npm |'
                      echo '|---|---|'
                      for f in release-assets/*.tgz; do
                          base="$(basename "$f" .tgz)"          # serene-pub-core-catalog-0.6.0-pr-2
                          name="${base%-$VERSION}"              # serene-pub-core-catalog
                          pkg="@serene-pub/${name#serene-pub-}" # @serene-pub/core-catalog
                          echo "| \`$pkg\` | [npm](https://www.npmjs.com/package/$pkg/v/$VERSION) |"
                      done
                      echo
                      echo 'Each package tarball attached here is the exact file npm received; `SHA256SUMS` lists their hashes.'
                  } > release-body.md
                  cat release-body.md

            - name: Create or update the GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.ref_name }}
                  name: Serene Pub SDK ${{ steps.kind.outputs.version }}
                  body_path: release-body.md
                  generate_release_notes: true
                  prerelease: ${{ steps.kind.outputs.prerelease }}
                  make_latest: ${{ steps.kind.outputs.prerelease == 'true' && 'false' || 'true' }}
                  files: |
                      release-assets/*.tgz
                      release-assets/SHA256SUMS
                  fail_on_unmatched_files: true
